services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    container_name: erp_api
    ports:
      - "8000:8000"

      # erp_api reads. not erp_db
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - db

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: erp_nginx
    ports:
      - "80:80"
    depends_on:
      - api

  db:
    image: mysql:8.0
    container_name: erp_db
    restart: unless-stopped
    env_file:
      - .env
    # from inside containers under compose.production
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
