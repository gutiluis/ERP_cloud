name: Pytest GitHub Actions CI Backend Tests

on:
  pull_request:
    branches:
      - testing
  push:
    branches:
      - testing
  workflow_dispatch:

jobs:
  pytest:
    name: Backend pytest
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "mysql+pymysql://erp:erp@127.0.0.1:3306/erp_test"

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: erp_test
          MYSQL_USER: erp
          MYSQL_PASSWORD: erp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies for pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run backend tests
        run: python -m pytest backend/tests
