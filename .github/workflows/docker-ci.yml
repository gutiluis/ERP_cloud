name: Docker CI

on:
  push:
    branches: [ "testing" ]
  pull_request:
    branches: [ "testing" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - dockerfile: ./ERP_cloud/docker/backend.Dockerfile
            image-name: backend
          - dockerfile: ./ERP_cloud/docker/frontend.Dockerfile
            image-name: frontend
          - dockerfile: ./ERP_cloud/docker/nginx.Dockerfile
            image-name: nginx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ERP_cloud
          # ${{ expression }} to dinamycally reference a value from a matrix strategy loop
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image-name }}:latest
          push: false
