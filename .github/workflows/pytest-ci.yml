name: Pytest CI

on:
  pull_request:
    branches:
      - testing
  workflow_dispatch:

jobs:
  pytest:
    name: Run backend tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: erp
          MYSQL_DATABASE: erp_test
          MYSQL_USER: erp
          MYSQL_PASSWORD: erp
        ports:
          - "3306:3306"

    env:
      DATABASE_URL: mysql+pymysql://erp:erp@127.0.0.1:3306/erp_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Pytest
        run: pip install pytest

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest backend/tests
