name: E2E Playwright

on:
  push:
    branches:
      - main
      - testing
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: e2e
    env:
      FLASK_CONFIG: ${{ vars.FLASK_CONFIG }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_SUCCESS_URL: ${{ vars.STRIPE_SUCCESS_URL }}
      STRIPE_CANCEL_URL: ${{ vars.STRIPE_CANCEL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build E2E services
        run: |
          docker compose -f compose.e2e.yaml build

      - name: Start E2E services
        run: |
          docker compose -f compose.e2e.yaml up -d --wait db e2e_api

      - name: Run database migrations
        run: |
          docker compose -f compose.e2e.yaml exec -T e2e_api \
            flask --app wsgi db upgrade

      - name: Verify database schema
        run: |
          docker compose -f compose.e2e.yaml exec -T e2e_api \
            flask db current
          docker compose -f compose.e2e.yaml exec -T db \
            mysql -u erp -perp erp_e2e \
            -e "SHOW TABLES LIKE 'products';"

      - name: Seed E2E database
        run: |
          docker compose -f compose.e2e.yaml exec -T e2e_api \
            python -m tests.seed_e2e

      - name: Verify E2E seed
        run: |
          docker compose -f compose.e2e.yaml exec -T e2e_api \
            python -c "
          from app import create_app
          from app.models import Product

          app = create_app('production')

          with app.app_context():
              products = Product.query.all()
              print(f'Products in E2E database: {len(products)}')
              for product in products:
                  print(product.name)
          "
      - name: Verify Vite API proxy
        run: |
          docker compose -f compose.e2e.yaml run --rm e2e_playwright \
            sh -c '
              npm run dev -- --host 0.0.0.0 --port 5173 > /tmp/vite.log 2>&1 &
              VITE_PID=$!

              trap "kill $VITE_PID" EXIT

              sleep 5

              echo "=== Environment ==="
              env | grep -E "VITE_API_TARGET|BASE_URL"

              echo "=== API through Vite ==="
              node -e "
              fetch(\"http://127.0.0.1:5173/api/products\")
                .then(async response => {
                  console.log(\"Status:\", response.status)
                  console.log(await response.text())
                  process.exit(response.ok ? 0 : 1)
                })
                .catch(error => {
                  console.error(error)
                  process.exit(1)
                })
              "

              echo "=== Vite log ==="
              cat /tmp/vite.log
            '
      - name: Verify E2E API networking
        run: |
          docker compose -f compose.e2e.yaml run --rm e2e_playwright \
            node -e "
              fetch('http://e2e_api:8000/api/products')
                .then(async r => {
                  console.log('Status:', r.status);
                  console.log(await r.text());
                  process.exit(r.ok ? 0 : 1);
                })
                .catch(err => {
                  console.error(err);
                  process.exit(1);
                });
            "
      - name: Run Playwright
        run: |
          docker compose -f compose.e2e.yaml run --rm e2e_playwright
