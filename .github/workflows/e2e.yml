name: CI E2E Playwright

on:
  push:
    branches:
      - main
      - testing
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: e2e
    env:
      FLASK_CONFIG: ${{ vars.FLASK_CONFIG }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_SUCCESS_URL: ${{ vars.STRIPE_SUCCESS_URL }}
      STRIPE_CANCEL_URL: ${{ vars.STRIPE_CANCEL_URL }}
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build E2E services
        run: |
          docker compose -f compose.e2e.yaml build

      - name: Start E2E services
        run: |
          docker compose -f compose.e2e.yaml up -d --wait db e2e-api

      - name: Run database migrations
        run: |
          docker compose -f compose.e2e.yaml exec -T e2e-api \
            flask db upgrade

      - name: Seed E2E database
        run: |
          docker compose -f compose.e2e.yaml exec -T e2e-api \
            python -m tests.seed_e2e
      - name: Check Stripe version
        run: |
          docker compose \
            -f compose.e2e.yaml \
            exec -T e2e-api \
            python -c "import stripe; print(stripe.VERSION)"

      - name: Run Playwright
        run: |
          docker compose -f compose.e2e.yaml run --rm e2e_playwright

      - name: Show E2E API logs
        if: always()
        run: |
          docker compose \
            -f compose.e2e.yaml \
            logs --no-color e2e-api
