name: CI E2E Playwright

on:
  push:
    branches:
      - main
      - testing
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: e2e
    env:
      FLASK_CONFIG: ${{ vars.FLASK_CONFIG }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_SUCCESS_URL: ${{ vars.STRIPE_SUCCESS_URL }}
      STRIPE_CANCEL_URL: ${{ vars.STRIPE_CANCEL_URL }}
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build E2E services
        run: |
          docker compose -f compose.e2e.yaml build

      - name: Start E2E services
        run: |
          docker compose -f compose.e2e.yaml up -d --wait db e2e-api

      - name: Run database migrations
        run: |
          docker compose -f compose.e2e.yaml exec -T e2e-api \
            flask db upgrade

      - name: Seed E2E database
        run: |
          docker compose -f compose.e2e.yaml exec -T e2e-api \
            python -m tests.seed_e2e

      - name: Run Playwright
        run: |
          docker compose -f compose.e2e.yaml run --rm e2e_playwright

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail workflow if E2E tests failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
