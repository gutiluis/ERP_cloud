name: Dependabot Pytest CI

on:
  pull_request:
    branches:
      - testing

jobs:
  pytest:
    name: Run backend tests for Dependabot
    # restricted to dependabot PRs
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dependabot

    env:
      FLASK_CONFIG: testing
      # dependabot secret store
      TEST_DATABASE_URL: mysql+pymysql://erp:erp@db:3306/erp_dependabot
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: erp_dependabot
          MYSQL_USER: erp
          MYSQL_PASSWORD: erp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Pytest
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest backend/tests
