version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "testing"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    # dependabot development updates target testing
    # main remains the protected release/production branch
    target-branch: "testing"
    allow:
      - dependency-type: "direct"
