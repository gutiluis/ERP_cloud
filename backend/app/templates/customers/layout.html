<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        {% block title %}
        {% endblock %}
        <meta name="description" content="customer layout">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
     
        <header>
            <h1>Admin Customers</h1>

            <nav>
                <h2>Customers</h2>
            </nav>
        </header>

        <main>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class=flashes>
                        {% for message in messages %}
                            <div class="flash">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            {% block content %}
            {% endblock %}
        </main>
        
    </body>
</html>
