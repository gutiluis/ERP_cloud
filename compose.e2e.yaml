services:

  db:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_DATABASE: erp_e2e
      MYSQL_USER: erp
      MYSQL_PASSWORD: erp
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  e2e_api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: "no"
    environment:
      FLASK_CONFIG: ${FLASK_CONFIG}
      DATABASE_URL: ${DATABASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      ALLOWED_HOSTS: localhost,127.0.0.1,e2e_api
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  e2e_playwright:
    build:
      context: .
      dockerfile: docker/Dockerfile.noble
    shm_size: 1gb
    restart: "no"
    environment:
      # vite and playwright run in same e2e_playwright container
      # playwright.config.js. frontend
      BASE_URL: http://127.0.0.1:5173
      # vite.config.js
      VITE_API_TARGET: http://e2e_api:8000
      PLAYWRIGHT_JSON_OUTPUT_DIR: /app/frontend/test-results
    depends_on:
      e2e_api:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./frontend/test-results
      # container paths based on playwright docker file workdir /app/frontend
      # update localhost and make new copy
        target: /app/frontend/test-results
